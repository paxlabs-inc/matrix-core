[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.27"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
# In-house only: production src/ has ZERO external import dependencies (no
# OpenZeppelin). forge-std is vendored under lib/ for TESTS ONLY and is never
# imported by src/. See README.md "No external dependencies".
fs_permissions = [{ access = "read", path = "./out" }]

[profile.ci]
verbosity = 4

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
paxeer = "${PAXEER_RPC_URL}"
