name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs on a branch when a new commit lands. Saves Actions
# minutes on hot PR threads.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.21.x"

jobs:
  # -------------------------------------------------------------------------
  # Fan out across the sibling Go modules. Each job is independent so one
  # module's regression does not mask another's. `fail-fast: false` keeps
  # the full grid visible on failure. cortex and executor are checked
  # locally, not on GitHub.
  # -------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.module }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        module: [core/mcl, bridge, gateway, router]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: go env
        run: go version && go env GOMODCACHE GOCACHE

      - name: go mod download
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: Neo Neocortex-only structural gate
        if: matrix.module == 'agents/neo'
        run: scripts/check-neo-neocortex-only.sh

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -race -timeout=10m ./...

  # -------------------------------------------------------------------------
  # Coverage — collect a single artefact so reviewers can audit per-module
  # surface without firing up a local toolchain.
  # -------------------------------------------------------------------------
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: cover (MCL)
        working-directory: core/mcl
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: cover (bridge)
        working-directory: bridge
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: cover (gateway)
        working-directory: gateway
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: cover (router)
        working-directory: router
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: upload coverage artefacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            core/mcl/coverage.out
            bridge/coverage.out
            gateway/coverage.out
            router/coverage.out
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  # mtx corpus — every SKILL.mtx must parse + validate.  Catches drift in
  # the 159-skill corpus introduced by protocol/tools/skills/convert_to_mtx.py runs.
  # -------------------------------------------------------------------------
  mtx-corpus:
    name: protocol/skills/SKILL.mtx validate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: core/mcl/go.sum

      # NOTE: core/mcl/cmd/mcl-validate/ is an empty scaffold dir (sess#15
      # placeholder; never implemented as a standalone binary). The
      # validation surface ships inside mclc itself — `mclc validate
      # <file>` covers spec §11. Build mclc and use that.
      - name: build mclc
        working-directory: core/mcl
        run: go build -o /tmp/mclc ./cmd/mclc

      - name: validate every SKILL.mtx in corpus
        run: |
          set -euo pipefail
          shopt -s nullglob
          failed=0
          count=0
          for f in protocol/skills/*/SKILL.mtx; do
            count=$((count + 1))
            if ! /tmp/mclc validate "$f" >/dev/null 2>&1; then
              echo "::error file=$f::SKILL.mtx failed validation"
              failed=$((failed + 1))
            fi
          done
          echo "checked $count SKILL.mtx files, $failed failed"
          exit $failed

  # -------------------------------------------------------------------------
  # CodeGraph — separate job because it pins its own Go toolchain (go.mod
  # 1.25, golang.org/x/tools). Runs the module's own test suite plus the graph
  # staleness gate: the committed graph store must match source, the same way
  # the spec checks require generated spec output to match spec/*.kvx. The gate
  # only walks source files (no full rebuild), so it is cheap and toolchain-
  # independent, and is a no-op until a graph store is committed.
  # -------------------------------------------------------------------------
  codegraph:
    name: build / codegraph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: protocol/codegraph/go.mod
          cache: true
          cache-dependency-path: protocol/codegraph/go.sum

      - name: go mod download
        working-directory: protocol/codegraph
        run: go mod download

      - name: gofmt
        working-directory: protocol/codegraph
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: protocol/codegraph
        run: go vet ./...

      - name: go build
        working-directory: protocol/codegraph
        run: go build ./...

      - name: go test
        working-directory: protocol/codegraph
        run: go test -count=1 -race -timeout=10m ./...

      - name: codegraph staleness gate
        working-directory: protocol/codegraph
        run: go run ./cmd/codegraph check -root ../.. -out ../graph

      - name: self-model graph staleness gate
        working-directory: protocol/codegraph
        run: go run ./cmd/codegraph check -root ../.. -self-model -out ../graph/self-model

  # -------------------------------------------------------------------------
  # Safety-critical faculties — the Neo completion gate and the Cassandra
  # completeness auditor. These modules were previously checked only locally,
  # which let a citation-removal refactor land with non-compiling test packages
  # (zero regression protection on the two subsystems that spiral). This job
  # forbids a non-compiling or red test package in either module (cody-launch
  # req.1 ac_4): a failing `go test ./...` here fails the build.
  # -------------------------------------------------------------------------
  agent-gate:
    name: build / ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [core/cassandra, agents/neo]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: astral-sh/setup-uv@v7
        if: matrix.module == 'agents/neo'
        with:
          version: "0.11.6"

      - uses: actions/setup-node@v4
        if: matrix.module == 'agents/neo'
        with:
          node-version: "22"

      - name: install Neo MCP runtimes
        if: matrix.module == 'agents/neo'
        run: |
          uv tool install --with "mcp==1.29.0" mcp-server-fetch==2025.4.7
          npm install --global @modelcontextprotocol/server-filesystem@2026.1.14

      - name: build Neocortex seam runtime
        if: matrix.module == 'agents/neo'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 lld-18 libc++-18-dev libc++abi-18-dev cmake ninja-build
          cmake --fresh --preset debug -S core/neocortex
          cmake --build core/neocortex/build/debug --target cortexd

      - name: go mod download
        working-directory: ${{ matrix.module }}
        run: go mod download

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      # A non-compiling test package fails `go test` (build-time), so this step
      # is the CI-style guard req.1 ac_4 requires: the refactor that broke these
      # packages could not have landed green.
      - name: go test
        working-directory: ${{ matrix.module }}
        env:
          MATRIX_FS_MCP_COMMAND: mcp-server-filesystem
        run: go test -count=1 -race -timeout=10m ./...

  workforce:
    name: build / workforce
    runs-on: ubuntu-latest
    env:
      DOCKER_API_VERSION: "1.44"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-go@v7
        with:
          go-version-file: workforce/go.mod
          cache: true
          cache-dependency-path: workforce/go.sum

      - name: install isolation runtime
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: preload Workforce PostgreSQL fixture
        run: docker pull --quiet postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20

      - name: go mod download
        working-directory: workforce
        run: go mod download

      - name: gofmt
        working-directory: workforce
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        working-directory: workforce
        run: go vet ./...

      - name: go build
        working-directory: workforce
        run: go build ./cmd/workforced ./cmd/workforce-seat ./cmd/workforce-auditor

      - uses: actions/setup-go@v7
        with:
          go-version-file: protocol/codegraph-ultra/go.mod
          cache: true
          cache-dependency-path: protocol/codegraph-ultra/go.sum

      - name: build CodeGraph Ultra
        working-directory: protocol/codegraph-ultra
        run: |
          go test -count=1 ./...
          go build -o /tmp/cg ./cmd/codegraph-ultra
          sudo install -o root -g root -m 0755 /tmp/cg /usr/local/bin/cg

      - uses: actions/setup-go@v7
        with:
          go-version-file: workforce/go.mod
          cache: true
          cache-dependency-path: workforce/go.sum

      - name: live CodeGraph Ultra adapter
        working-directory: workforce
        run: |
          mkdir -p ../.cg
          /usr/local/bin/cg --db ../.cg/codegraph.db build .. \
            --exclude node_modules --exclude .next --exclude .git --exclude .codegraph
          WORKFORCE_CODEGRAPH_ULTRA_LIVE_EXECUTABLE=/usr/local/bin/cg \
            go test -count=1 ./internal/projectbrain \
              -run '^TestIntegration_CodeGraphUltraCurrentIndex$'

      - name: go test
        working-directory: workforce
        run: go test -count=1 -race -timeout=15m ./...

  service-supervisor:
    name: service supervisor safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: verified process identity
        run: node --test protocol/tools/exec/exec.test.mjs

      - name: exec manifest and lifecycle smoke
        run: node protocol/tools/exec/exec.mjs --selftest

      - name: production manifests exclude local coding MCP
        run: |
          set -euo pipefail
          for manifest in agents/default.json agents/neo.json; do
            jq -e '[.servers[].alias] | all(. != "fs" and . != "git" and . != "exec")' "$manifest" >/dev/null
          done

      - name: recurring alarm deduplication
        run: node protocol/tools/chronos/chronos.mjs --selftest

      - name: rollout script syntax
        run: bash -n deploy/railway/entrypoint.sh deploy/railway/audit-service-supervisors.sh deploy/railway/rollout-service-supervisor.sh

  # -------------------------------------------------------------------------
  # Aggregator job — branch protection should require `ci-passed` only.
  # Any added/removed leaf job stays decoupled from the protection rule.
  # -------------------------------------------------------------------------
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [build, agent-gate, workforce, service-supervisor, mtx-corpus, codegraph]
    if: always()
    steps:
      - name: aggregate
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more upstream jobs failed"
            exit 1
          fi
          echo "all checks passed"
