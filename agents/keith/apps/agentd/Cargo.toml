[package]
name = "keith-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
test-fault-injection = ["keith-daemon-core/test-fault-injection"]

[dependencies]
keith-build-info = { path = "../../crates/build-info" }
keith-configuration = { path = "../../crates/configuration" }
keith-daemon-core = { path = "../../crates/daemon-core" }
keith-local-runtime = { path = "../../crates/local-runtime" }
keith-platform = { path = "../../crates/platform" }
keith-self-evolution = { path = "../../crates/self-evolution" }
keith-worker-runtime = { path = "../../crates/worker-runtime" }
signal-hook.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
keith-agent-web = { path = "../agent-web" }
keith-agent-types = { path = "../../crates/agent-types" }
keith-connection = { path = "../../crates/connection" }
keith-credentials = { path = "../../crates/credentials" }
keith-protocol = { path = "../../crates/protocol" }
keith-platform-contracts = { path = "../../crates/platform-contracts" }
keith-runtime-api = { path = "../../crates/runtime-api" }
keith-sandbox = { path = "../../crates/sandbox" }
keith-state-store = { path = "../../crates/state-store" }
keith-state-store-core = { path = "../../crates/state-store-core" }
ring.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[bin]]
name = "agentd"
path = "src/main.rs"

[[bin]]
name = "keith-daemon-worker-host"
path = "tests/support/worker_process_host.rs"

[lints]
workspace = true
