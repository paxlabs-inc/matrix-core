[workspace]
members = ["apps/*", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/Sidiora-Labs/keith-agent"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
axum = { version = "0.8.9", features = ["form", "http1", "json", "tokio", "ws"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
crossterm = "0.29.0"
fs2 = "0.4.3"
futures-util = "0.3.34"
getrandom = "0.3.4"
interprocess = "2.4.2"
js-sys = "0.3.104"
keyring = "4.1.5"
os_pipe = "1.2.3"
nix = { version = "0.30.1", features = ["process", "signal"] }
proptest = "1.9.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rmp-serde = "1.3.0"
ring = "0.17.14"
rusqlite = { version = "0.37.0", features = ["bundled"] }
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
signal-hook = "0.3.18"
thiserror = "2.0.18"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.8"
tungstenite = { version = "0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
unicode-width = "0.2.2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
ulid = "1.2.1"
wasm-bindgen = "0.2.127"
web-sys = "0.3.104"
wasmtime = { version = "36.0.14", default-features = false, features = ["cranelift", "runtime"] }
wat = "1.240.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
