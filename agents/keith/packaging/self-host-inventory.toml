schema_version = 1
product = "keith"
deployment = "self_hosted"
state_owner = "agentd"
cloud_dependency = false
neo_dependency = false

[release]
manifest = "release-manifest.json"
signature = "release-manifest.json.sig"
checksums = "SHA256SUMS"
require_signature_before_install = true
require_signature_before_rollback = true

[paths]
prefix = "/opt/keith"
configuration = "/etc/keith"
state = "/var/lib/keith"
runtime = "/run/keith"
logs = "/var/log/keith"
backups = "/var/backups/keith"
schemas = "/opt/keith/share/schemas"
migrations = "/opt/keith/share/migrations"

[[service]]
name = "agentd"
binary = "/opt/keith/bin/agentd"
unit = "keith-agentd.service"
required = true
state_writer = true
after = ["local-fs.target"]
owns = ["state", "runtime_socket", "schema_migrations", "profile_workers", "resource_reports"]

[[service]]
name = "agent-web"
binary = "/opt/keith/bin/agent-web"
unit = "keith-agent-web.service"
required = false
state_writer = false
after = ["keith-agentd.service"]
owns = ["http_listener", "static_assets"]

[[service]]
name = "browser-runner"
binary = "/opt/keith/bin/keith-browser-runner"
unit = "keith-browser-runner@.service"
required = false
state_writer = false
supervisor = "agentd"
owns = ["profile_scoped_chromium", "profile_scoped_xvfb", "browser_control_socket"]

[[client]]
name = "desktop"
binary = "/opt/keith/bin/agent-desktop"
required = false
connects_to = "agent-web_or_agentd"

[[client]]
name = "cli"
binary = "/opt/keith/bin/agent-cli"
required = false
connects_to = "agentd"

[[client]]
name = "tui"
binary = "/opt/keith/bin/agent-tui"
required = false
connects_to = "agentd"

[[runtime_dependency]]
name = "xvfb"
required_when = "headed_browser_enabled"
discovery = "KEITH_XVFB"

[[runtime_dependency]]
name = "chromium"
required_when = "headed_browser_enabled"
discovery = "KEITH_CHROMIUM"

[[install_asset]]
name = "schemas"
source = "share/schemas"
destination = "/opt/keith/share/schemas"
immutable_per_release = true

[[install_asset]]
name = "migrations"
source = "share/migrations"
destination = "/opt/keith/share/migrations"
immutable_per_release = true

[[operation]]
name = "backup"
requires = ["quiesced_writers", "consistent_state_root", "release_manifest", "configuration_without_secret_values"]

[[operation]]
name = "restore"
requires = ["stopped_services", "verified_backup_manifest", "matching_or_newer_migration_oracle", "post_restore_integrity_scan"]

[[operation]]
name = "upgrade"
requires = ["verified_release_signature", "pre_upgrade_backup", "migration_preflight", "atomic_release_pointer"]

[[operation]]
name = "rollback"
requires = ["verified_previous_release", "schema_compatibility_or_backup_restore", "atomic_release_pointer"]

[[operation]]
name = "uninstall"
requires = ["stopped_services", "package_files_removed", "state_retained_by_default", "resource_report"]

[[operation]]
name = "erase"
requires = ["explicit_installation_owner_confirmation", "stopped_services", "backup_disposition", "state_and_secret_erasure", "remnant_scan", "resource_report"]
