<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Neo — Adaptive Surface (concept)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Figtree ≈ stand-in for the client's PP Pangram Sans Rounded; JetBrains Mono per house mono. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ───────────────────────────────────────────────────────────────────
         Neo "Adaptive Surface" — single morphing surface.
         Structure follows the reference (temp/neo.html); the SKIN is the real
         client design system (client/app/globals.css):
           - separation by TONE only — no borders / shadows / glow for depth
           - single flat accent #004ced; oklch tone ladder
           - flat surfaces (no glass, no gradient atmosphere)
         Hard UI rules honored: no border-strokes for depth, no glow, no
         decorative gradients, no emoji.
         ─────────────────────────────────────────────────────────────────── */
      :root {
        --pax: #004ced;
        --pax-soft: #004ced24;
        --pax-softer: #004ced14;

        /* tone ladder — straight from globals.css */
        --stage: oklch(0.118 0.004 264);
        --app: oklch(0.145 0.004 264);
        --card: oklch(0.185 0.005 264);
        --popover: oklch(0.215 0.005 264);
        --muted: oklch(0.235 0.005 264);
        --accent: oklch(0.27 0.006 264);

        --fg: oklch(0.97 0.002 264);
        --fg2: oklch(0.66 0.006 264);
        --fg3: oklch(0.52 0.006 264);

        --ok: oklch(0.72 0.14 155);
        --danger: oklch(0.62 0.2 25);

        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --r-pill: 999px;
        --r-card: 28px;

        --ui: 'Figtree', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
        --mono: 'JetBrains Mono', ui-monospace, monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--ui);
        background: var(--stage);
        color: var(--fg);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        letter-spacing: -0.01em;
      }
      ::selection {
        background: #004ced40;
      }
      :focus-visible {
        outline: 2px solid var(--pax);
        outline-offset: 2px;
      }
      button {
        font-family: inherit;
        color: inherit;
        border: 0;
        background: none;
        cursor: pointer;
      }

      /* ── Stage: flat tone + faint spec-sheet grid (no glow, no gradient color) ── */
      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--stage);
      }
      .stage::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, oklch(1 0 0 / 0.022) 1px, transparent 1px),
          linear-gradient(to bottom, oklch(1 0 0 / 0.022) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: radial-gradient(circle at 50% 46%, #000 30%, transparent 76%);
      }

      /* ── Top chrome ── */
      .chrome {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 22px 26px;
        transition: opacity 0.5s var(--ease);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.16em;
        font-size: 12.5px;
        text-transform: uppercase;
      }
      .mark {
        width: var(--s, 22px);
        height: var(--s, 22px);
        border-radius: 7px;
        background: var(--pax);
        display: grid;
        place-items: center;
        flex: none;
      }
      .mark i {
        width: 40%;
        height: 40%;
        background: var(--stage);
        border-radius: 2px;
        display: block;
      }
      .statepill {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg3);
        background: var(--card);
        border-radius: var(--r-pill);
        padding: 7px 13px;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .statepill .live {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--fg3);
        transition: background 0.4s;
      }
      [data-state='thinking'] .statepill .live {
        background: var(--pax);
        animation: pulse 1s infinite;
      }
      [data-state='task'] .statepill .live {
        background: var(--ok);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* ── The morphing surface ── */
      .surface-wrap {
        position: relative;
        width: 100%;
        max-width: 720px;
        padding: 0 20px;
        display: grid;
        place-items: center;
      }
      .surface {
        position: relative;
        z-index: 10;
        width: 640px;
        max-width: 100%;
        background: var(--card);
        overflow: hidden;
        height: 64px;
        border-radius: var(--r-pill);
        transition:
          width 0.6s var(--ease),
          height 0.62s var(--ease),
          border-radius 0.6s var(--ease),
          transform 0.5s var(--ease),
          opacity 0.4s var(--ease);
        will-change: height, width, border-radius, transform;
      }
      [data-state='task'] .surface,
      [data-state='thinking'] .surface {
        height: var(--task-h, 460px);
        border-radius: var(--r-card);
      }

      /* REST: the input pill */
      .rest {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 16px;
        opacity: 1;
        transition: opacity 0.26s var(--ease);
      }
      [data-state='thinking'] .rest,
      [data-state='task'] .rest {
        opacity: 0;
        pointer-events: none;
      }
      .rest .lead {
        flex: none;
      }
      .rest input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--fg);
        font-family: var(--ui);
        font-size: 16px;
        font-weight: 500;
      }
      .rest input::placeholder {
        color: var(--fg3);
      }
      .rest .send {
        width: 48px;
        height: 48px;
        flex: none;
        border-radius: 50%;
        background: var(--pax);
        color: #fff;
        display: grid;
        place-items: center;
        transition:
          transform 0.22s var(--ease),
          filter 0.2s;
      }
      .rest .send:hover {
        transform: scale(1.05);
        filter: brightness(1.08);
      }
      .rest .send:active {
        transform: scale(0.94);
      }

      /* TASK shell */
      .task {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        opacity: 0;
        transition: opacity 0.3s var(--ease) 0.12s;
        pointer-events: none;
      }
      [data-state='thinking'] .task,
      [data-state='task'] .task {
        opacity: 1;
        pointer-events: auto;
      }
      .grab {
        flex: none;
        padding: 13px 0 7px;
        display: grid;
        place-items: center;
        cursor: grab;
        touch-action: none;
      }
      .grab:active {
        cursor: grabbing;
      }
      .grab i {
        display: block;
        width: 40px;
        height: 5px;
        border-radius: 99px;
        background: var(--accent);
        transition:
          background 0.3s,
          width 0.3s;
      }
      .grab:hover i {
        background: var(--fg3);
        width: 52px;
      }
      .grab .hint {
        font-size: 10.5px;
        color: var(--fg3);
        letter-spacing: 0.04em;
        margin-top: 9px;
        font-family: var(--mono);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .grab.show-hint .hint {
        opacity: 1;
      }

      /* head sits on a slightly lighter tone band → layered without a stroke */
      .task-head {
        flex: none;
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 4px 22px 16px;
      }
      .task-head .ic {
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        background: var(--pax-soft);
        color: var(--pax);
        flex: none;
      }
      .task-head .ttl {
        font-weight: 700;
        font-size: 15px;
      }
      .task-head .sub {
        font-size: 11.5px;
        color: var(--fg3);
        font-family: var(--mono);
        margin-top: 1px;
      }
      .task-head .x {
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--fg2);
        flex: none;
      }
      .task-head .x:hover {
        background: var(--muted);
        color: var(--fg);
      }

      .task-body {
        flex: 1;
        overflow-y: auto;
        padding: 2px 22px 24px;
        scrollbar-width: thin;
        scrollbar-color: var(--accent) transparent;
      }
      .task-body::-webkit-scrollbar {
        width: 6px;
      }
      .task-body::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 99px;
      }

      /* reasoning trace (the thought process, as intention) */
      .trace {
        display: flex;
        flex-direction: column;
        gap: 13px;
        margin-bottom: 4px;
      }
      .trace .step {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        opacity: 0;
        transform: translateY(6px);
        animation: rise 0.5s var(--ease-out) forwards;
      }
      .trace .step .gut {
        display: flex;
        flex-direction: column;
        align-items: center;
        flex: none;
        padding-top: 3px;
      }
      .trace .step .node {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--muted);
        transition: background 0.3s;
      }
      .trace .step.done .node {
        background: var(--pax);
      }
      .trace .step .stem {
        width: 2px;
        flex: 1;
        min-height: 14px;
        background: var(--muted);
        margin-top: 3px;
      }
      .trace .step:last-child .stem {
        display: none;
      }
      .trace .step .lbl {
        font-size: 13.5px;
        color: var(--fg2);
        line-height: 1.5;
      }
      .trace .step.done .lbl {
        color: var(--fg);
      }
      .trace .step .lbl b {
        color: var(--fg);
        font-weight: 600;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      .result {
        opacity: 0;
        animation: rise 0.55s var(--ease-out) forwards;
      }
      .gap {
        height: 18px;
      }

      /* search */
      .answer {
        font-size: 15px;
        line-height: 1.6;
        color: var(--fg);
        margin-bottom: 16px;
      }
      .answer .hl {
        color: var(--pax);
        font-weight: 600;
      }
      .seclabel {
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--fg3);
        margin: 4px 2px 10px;
      }
      .src {
        display: flex;
        gap: 13px;
        padding: 13px;
        background: var(--popover);
        border-radius: 14px;
        margin-bottom: 9px;
        transition: background 0.22s;
        cursor: pointer;
      }
      .src:hover {
        background: var(--muted);
      }
      .src .fav {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        flex: none;
        background: var(--muted);
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--fg2);
        font-weight: 600;
      }
      .src:hover .fav {
        background: var(--accent);
      }
      .src h4 {
        font-size: 13.5px;
        font-weight: 600;
        margin-bottom: 3px;
      }
      .src p {
        font-size: 12px;
        color: var(--fg3);
        line-height: 1.45;
      }
      .src .url {
        font-size: 10.5px;
        color: var(--pax);
        font-family: var(--mono);
        margin-top: 5px;
      }

      /* wallet — rows separated by 1px tone GAPS (container tone shows through) */
      .esc {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--pax-soft);
        border-radius: 14px;
        padding: 12px 14px;
        margin-bottom: 14px;
        font-size: 13px;
        line-height: 1.5;
      }
      .esc .ic {
        color: var(--pax);
        flex: none;
        margin-top: 1px;
      }
      .wallet {
        background: var(--muted);
        border-radius: 18px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .wallet > * {
        background: var(--popover);
      }
      .wallet .net {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
      }
      .wallet .net .chip {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12.5px;
        font-weight: 600;
      }
      .wallet .net .chip .b {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--ok);
      }
      .wallet .net .id {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg3);
      }
      .amt {
        text-align: center;
        padding: 24px 16px 18px;
      }
      .amt .big {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
      }
      .amt .big span {
        font-size: 21px;
        color: var(--fg3);
        font-weight: 600;
        margin-left: 6px;
      }
      .amt .fiat {
        font-size: 13px;
        color: var(--fg3);
        margin-top: 8px;
        font-family: var(--mono);
      }
      .wrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 16px;
        font-size: 13px;
      }
      .wrow .k {
        color: var(--fg3);
      }
      .wrow .v {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .wrow .v.addr {
        color: var(--fg2);
      }

      /* slide to sign */
      .sign {
        position: relative;
        margin: 16px 2px 4px;
        height: 58px;
        border-radius: var(--r-pill);
        background: var(--muted);
        overflow: hidden;
        user-select: none;
        touch-action: none;
      }
      .sign .track-lbl {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 13.5px;
        font-weight: 600;
        color: var(--fg2);
        padding-left: 30px;
        pointer-events: none;
      }
      .sign .knob {
        position: absolute;
        top: 5px;
        left: 5px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        cursor: grab;
        background: var(--pax);
        display: grid;
        place-items: center;
        color: #fff;
        transition: left 0.35s var(--ease);
      }
      .sign.signed {
        background: var(--pax-soft);
      }
      .sign.signed .knob {
        background: var(--ok);
        color: #04140e;
        left: calc(100% - 53px);
      }
      .sign.signed .track-lbl {
        color: var(--ok);
      }
      .sign-cap {
        text-align: center;
        font-size: 11.5px;
        color: var(--fg3);
        margin-top: 10px;
      }

      /* code */
      .codewrap {
        border-radius: 16px;
        overflow: hidden;
        background: var(--app);
      }
      .codewrap .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--muted);
      }
      .codewrap .bar .fn {
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--fg3);
      }
      .codewrap .bar .cp {
        font-size: 11px;
        color: var(--fg2);
        background: var(--popover);
        padding: 5px 11px;
        border-radius: 7px;
        cursor: pointer;
        font-family: var(--mono);
        transition: 0.2s;
      }
      .codewrap .bar .cp:hover {
        color: var(--fg);
        background: var(--accent);
      }
      pre {
        margin: 0;
        padding: 16px;
        overflow: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.7;
      }
      pre .kw {
        color: #6aa3ff;
      }
      pre .fn {
        color: #3dd4c0;
      }
      pre .str {
        color: var(--ok);
      }
      pre .cm {
        color: var(--fg3);
      }
      pre .nm {
        color: #d6b25e;
      }

      /* image — flat illustrative render (no gradient), shimmer while "rendering" */
      .imgwrap {
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        aspect-ratio: 16/10;
        background: var(--popover);
      }
      .imgwrap svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        animation: reveal 1.2s var(--ease-out) 0.6s forwards;
      }
      @keyframes reveal {
        to {
          opacity: 1;
        }
      }
      .imgwrap .shim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          100deg,
          transparent 35%,
          rgba(255, 255, 255, 0.06) 50%,
          transparent 65%
        );
        transform: translateX(-100%);
        animation: sweep 1.5s var(--ease) 2 forwards;
      }
      @keyframes sweep {
        to {
          transform: translateX(100%);
        }
      }
      .imgwrap .cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 11px 14px;
        font-size: 11.5px;
        color: var(--fg2);
        background: var(--stage);
        font-family: var(--mono);
      }

      /* settings — rows separated by tone gaps */
      .setgroup {
        background: var(--muted);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 1px;
        margin-bottom: 10px;
      }
      .setrow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px;
        background: var(--popover);
      }
      .setrow .t {
        font-size: 14px;
        font-weight: 600;
      }
      .setrow .d {
        font-size: 11.5px;
        color: var(--fg3);
        margin-top: 2px;
      }
      .tog {
        width: 46px;
        height: 27px;
        border-radius: 99px;
        background: var(--accent);
        position: relative;
        cursor: pointer;
        transition: 0.3s;
        flex: none;
      }
      .tog::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: #fff;
        transition: 0.3s var(--ease);
      }
      .tog.on {
        background: var(--pax);
      }
      .tog.on::after {
        left: 22px;
      }
      .seg {
        display: flex;
        gap: 3px;
        background: var(--accent);
        border-radius: 11px;
        padding: 3px;
        flex: none;
      }
      .seg button {
        color: var(--fg2);
        font-family: var(--ui);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        transition: 0.2s;
      }
      .seg button.on {
        background: var(--pax);
        color: #fff;
      }

      .reply {
        font-size: 15px;
        line-height: 1.65;
        color: var(--fg);
      }

      /* suggestion rail */
      .rail {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(50% + 56px);
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 640px;
        transition:
          opacity 0.35s var(--ease),
          transform 0.45s var(--ease);
      }
      [data-state='thinking'] .rail,
      [data-state='task'] .rail {
        opacity: 0;
        transform: translate(-50%, 12px);
        pointer-events: none;
      }
      .chip {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--fg2);
        cursor: pointer;
        background: var(--card);
        padding: 9px 15px;
        border-radius: var(--r-pill);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.22s var(--ease);
      }
      .chip:hover {
        color: var(--fg);
        background: var(--accent);
        transform: translateY(-1px);
      }
      .chip svg {
        width: 14px;
        height: 14px;
        opacity: 0.7;
      }

      /* login */
      .login {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: var(--stage);
        transition:
          opacity 0.8s var(--ease),
          transform 0.8s var(--ease);
      }
      .login::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(to right, oklch(1 0 0 / 0.022) 1px, transparent 1px),
          linear-gradient(to bottom, oklch(1 0 0 / 0.022) 1px, transparent 1px);
        background-size: 54px 54px;
        mask-image: radial-gradient(circle at 50% 42%, #000 26%, transparent 70%);
      }
      .login.gone {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      .login-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: rise 0.9s var(--ease-out);
      }
      .login .mark {
        --s: 60px;
        border-radius: 17px;
        margin-bottom: 26px;
      }
      .login h1 {
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .login .tag {
        color: var(--fg3);
        font-size: 13.5px;
        margin-top: 9px;
        font-family: var(--mono);
        letter-spacing: 0.02em;
      }
      .login .connect {
        margin-top: 36px;
        font-size: 14.5px;
        font-weight: 700;
        color: #fff;
        padding: 16px 30px;
        border-radius: var(--r-pill);
        background: var(--pax);
        transition:
          transform 0.25s var(--ease),
          filter 0.2s;
      }
      .login .connect:hover {
        transform: translateY(-2px);
        filter: brightness(1.08);
      }
      .login .connect:active {
        transform: scale(0.97);
      }
      .login .did {
        margin-top: 18px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--fg3);
      }
      .login .signing {
        margin-top: 36px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--pax);
        display: none;
        align-items: center;
        gap: 10px;
      }
      .login.auth .connect {
        display: none;
      }
      .login.auth .signing {
        display: flex;
      }
      .login .sp {
        width: 14px;
        height: 14px;
        border: 2px solid var(--muted);
        border-top-color: var(--pax);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .footnote {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 11px;
        color: var(--fg3);
        font-family: var(--mono);
        z-index: 30;
        transition: opacity 0.4s;
      }
      [data-state='thinking'] .footnote,
      [data-state='task'] .footnote {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div class="login" id="login">
      <div class="login-card">
        <div class="mark"><i></i></div>
        <h1>Neo</h1>
        <div class="tag">one surface · zero clutter</div>
        <button class="connect" id="connectBtn">Continue with Paxeer</button>
        <div class="did">DID · ed25519 challenge–response</div>
        <div class="signing"><span class="sp"></span> Verifying your identity…</div>
      </div>
    </div>

    <!-- APP -->
    <div class="stage" id="app" data-state="idle">
      <div class="chrome">
        <div class="brand">
          <span class="mark"><i></i></span> Neo
        </div>
        <div class="statepill"><span class="live"></span><span id="stateLabel">idle</span></div>
      </div>

      <div class="surface-wrap">
        <div class="rail" id="rail">
          <div class="chip" data-cmd="search dolphins">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7" />
              <path d="m21 21-4-4" />
            </svg>
            Search “dolphins”
          </div>
          <div class="chip" data-cmd="send 250 pax">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v20M5 9l7-7 7 7" />
            </svg>
            Send PAX
          </div>
          <div class="chip" data-cmd="write code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m8 6-6 6 6 6M16 6l6 6-6 6" />
            </svg>
            Write code
          </div>
          <div class="chip" data-cmd="imagine a lighthouse">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="9" cy="9" r="2" />
              <path d="m21 15-5-5L5 21" />
            </svg>
            Imagine
          </div>
          <div class="chip" data-cmd="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2v3M12 19v3M5 5l2 2M17 17l2 2M2 12h3M19 12h3" />
            </svg>
            Settings
          </div>
        </div>

        <!-- THE MORPHING SURFACE -->
        <div class="surface" id="surface" style="--task-h: 460px">
          <!-- rest pill -->
          <div class="rest">
            <span class="lead mark" aria-hidden="true"><i></i></span>
            <input id="bar" placeholder="Ask Neo anything…" autocomplete="off" />
            <button class="send" id="sendBtn" aria-label="Send">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
              >
                <path d="M5 12h14M13 6l6 6-6 6" />
              </svg>
            </button>
          </div>

          <!-- task shell -->
          <div class="task">
            <div class="grab" id="grab"><i></i><span class="hint">swipe up to dismiss</span></div>
            <div class="task-head">
              <div class="ic" id="taskIc"></div>
              <div>
                <div class="ttl" id="taskTitle"></div>
                <div class="sub" id="taskSub"></div>
              </div>
              <button class="x" id="taskX" aria-label="Dismiss">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="M18 15l-6-6-6 6" />
                </svg>
              </button>
            </div>
            <div class="task-body" id="taskBody"></div>
          </div>
        </div>
      </div>

      <div class="footnote">Neo Adaptive Surface · conceptual mockup</div>
    </div>

    <script>
      /* ============================================================
         Neo — single-surface state machine
         idle → thinking → task → (dismiss) → idle
         ============================================================ */
      const app = document.getElementById('app')
      const surface = document.getElementById('surface')
      const stateLabel = document.getElementById('stateLabel')
      const bar = document.getElementById('bar')
      const taskBody = document.getElementById('taskBody')
      const taskTitle = document.getElementById('taskTitle')
      const taskSub = document.getElementById('taskSub')
      const taskIc = document.getElementById('taskIc')
      const grab = document.getElementById('grab')

      let firstTask = true

      const ICON = {
        search:
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>',
        wallet:
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M16 13h.01"/></svg>',
        code: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg>',
        image:
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
        settings:
          '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M5 5l2 2M17 17l2 2M2 12h3M19 12h3"/></svg>',
        chat: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>',
        shield:
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/></svg>',
      }

      /* intent router: natural language → surface */
      function classify(t) {
        t = t.toLowerCase()
        if (/(send|pay|transfer|sign|swap|stake|\bpax\b)/.test(t)) return 'wallet'
        if (/(code|function|script|write a|component|api|debounce)/.test(t)) return 'code'
        if (/(image|imagine|draw|picture|render|lighthouse)/.test(t)) return 'image'
        if (/(setting|preference|config|model|theme)/.test(t)) return 'settings'
        if (/(search|find|look up|who|what|where|dolphin)/.test(t)) return 'search'
        return 'chat'
      }

      function traceSteps(steps) {
        const wrap = document.createElement('div')
        wrap.className = 'trace'
        steps.forEach((s, i) => {
          const el = document.createElement('div')
          el.className = 'step'
          el.style.animationDelay = i * 0.18 + 's'
          el.innerHTML =
            '<div class="gut"><div class="node"></div><div class="stem"></div></div><div class="lbl">' +
            s +
            '</div>'
          wrap.appendChild(el)
          setTimeout(() => el.classList.add('done'), i * 180 + 520)
        })
        return wrap
      }

      /* Human, intention-first copy (per the transparency rule: surface the
         intention, not the tool names). Substantive context — sources, chain,
         finality — is kept because it builds trust. */
      const SURFACES = {
        search: {
          title: 'Web search',
          sub: 'dolphins · 4 sources',
          h: 520,
          trace: [
            'Working out what you’re really asking',
            'Searching the open web — <b>dolphins</b>',
            'Reading and cross-checking 4 sources',
            'Pulling out what actually matters',
          ],
          body:
            '<div class="answer">Dolphins are highly intelligent marine mammals of the family <span class="hl">Delphinidae</span> — they live in tight social pods, hunt cooperatively with echolocation, and use signature whistles that work like names.</div>' +
            '<div class="seclabel">Sources</div>' +
            '<div class="src"><div class="fav">OC</div><div><h4>Dolphin — overview &amp; cognition</h4><p>Toothed whales with large, convoluted brains; show self-recognition and tool use.</p><div class="url">oceana.org/marine-life/dolphin</div></div></div>' +
            '<div class="src"><div class="fav">NO</div><div><h4>Signature whistles &amp; pods</h4><p>Bottlenose dolphins call each other by name and coordinate group hunts.</p><div class="url">fisheries.noaa.gov/bottlenose</div></div></div>' +
            '<div class="src"><div class="fav">NG</div><div><h4>How echolocation works</h4><p>Clicks map prey and seafloor in murky water — “seeing” with sound.</p><div class="url">nationalgeographic.com/dolphin</div></div></div>' +
            '<div class="src"><div class="fav">WW</div><div><h4>River dolphins at risk</h4><p>Freshwater species are among the most endangered cetaceans.</p><div class="url">worldwildlife.org/river-dolphins</div></div></div>',
        },

        wallet: {
          title: 'Send 250 PAX',
          sub: 'HyperPaxeer · ~400 ms finality',
          h: 596,
          trace: [
            'Understood: send <b>250 PAX</b> to pax1q8…f3kd',
            'Routing through the secure path',
            'Dry-ran it safely — no funds touched yet',
            'Ready for your approval',
          ],
          body:
            '<div class="esc"><span class="ic">' +
            ICON.shield +
            '</span><span>This moves real funds, so I can’t sign on my own. The one step that needs you is the approval below.</span></div>' +
            '<div class="wallet">' +
            '<div class="net"><div class="chip"><span class="b"></span>HyperPaxeer</div><div class="id">chain 125</div></div>' +
            '<div class="amt"><div class="big">250<span>PAX</span></div><div class="fiat">≈ $312.50</div></div>' +
            '<div class="wrow"><span class="k">To</span><span class="v addr">pax1q8…f3kd</span></div>' +
            '<div class="wrow"><span class="k">Network fee</span><span class="v">0.0012 PAX</span></div>' +
            '<div class="wrow"><span class="k">Finality</span><span class="v">~400 ms · single block</span></div>' +
            '</div>' +
            '<div class="sign" id="signTrack"><div class="track-lbl" id="signLbl">Slide to approve</div><div class="knob" id="signKnob"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div></div>' +
            '<div class="sign-cap">Your wallet signs locally. Neo never holds your key.</div>',
          after: initSign,
        },

        code: {
          title: 'Code',
          sub: 'TypeScript',
          h: 470,
          trace: [
            'Thinking through the approach',
            'Writing it in <b>TypeScript</b>',
            'Checking the edge cases',
          ],
          body:
            '<div class="codewrap"><div class="bar"><span class="fn">intent.ts</span><span class="cp" onclick="this.textContent=\'copied\';setTimeout(()=>this.textContent=\'copy\',1200)">copy</span></div>' +
            '<pre><span class="cm">// Resolve a natural-language ask into a typed on-chain intent</span>\n' +
            '<span class="kw">export async function</span> <span class="fn">resolveIntent</span>(text: <span class="nm">string</span>) {\n' +
            '  <span class="kw">const</span> intent = <span class="kw">await</span> matrix.<span class="fn">plan</span>(text)\n' +
            '  <span class="kw">if</span> (intent.kind === <span class="str">"transfer"</span>) {\n' +
            '    <span class="kw">return</span> wallet.<span class="fn">sign</span>({\n' +
            '      chainId: <span class="nm">125</span>,\n' +
            '      to: intent.to,\n' +
            '      amount: intent.amount,\n' +
            '    })\n' +
            '  }\n' +
            '  <span class="kw">return</span> agent.<span class="fn">dispatch</span>(intent)\n' +
            '}</pre></div>',
        },

        image: {
          title: 'Image',
          sub: '1024 × 1024',
          h: 500,
          trace: [
            'Composing the scene',
            'Rendering — this uses an API I pay for, not your wallet',
            'Sharpening the details',
          ],
          body:
            '<div class="imgwrap">' +
            '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice">' +
            '<rect width="320" height="200" fill="oklch(0.26 0.03 250)"/>' +
            '<rect y="150" width="320" height="50" fill="oklch(0.32 0.04 250)"/>' +
            '<rect x="150" y="44" width="20" height="112" rx="3" fill="oklch(0.84 0.02 250)"/>' +
            '<rect x="152" y="58" width="16" height="12" fill="#004ced"/>' +
            '<circle cx="160" cy="40" r="11" fill="oklch(0.88 0.03 250)"/>' +
            '<path d="M160 28 L171 40 L149 40 Z" fill="oklch(0.72 0.02 250)"/>' +
            '<circle cx="248" cy="44" r="16" fill="oklch(0.84 0.03 250)" opacity="0.4"/>' +
            '</svg>' +
            '<div class="shim"></div>' +
            '<div class="cap">“a lighthouse at dusk” — illustrative render · operator API, no funds moved</div></div>',
        },

        settings: {
          title: 'Preferences',
          sub: 'inline · no separate screen',
          h: 440,
          trace: ['Opening your preferences'],
          body:
            '<div class="setgroup">' +
            '<div class="setrow"><div><div class="t">Response style</div><div class="d">How Neo talks back</div></div><div class="seg"><button>Brief</button><button class="on">Balanced</button><button>Deep</button></div></div>' +
            '<div class="setrow"><div><div class="t">Theme</div><div class="d">Dark is native</div></div><div class="seg"><button class="on">Dark</button><button>System</button></div></div>' +
            '</div>' +
            '<div class="setgroup">' +
            '<div class="setrow"><div><div class="t">Show the work</div><div class="d">Surface searches &amp; steps inline</div></div><div class="tog on" data-tog></div></div>' +
            '<div class="setrow"><div><div class="t">Confirm every spend</div><div class="d">Always ask before funds move</div></div><div class="tog on" data-tog></div></div>' +
            '<div class="setrow"><div><div class="t">Swipe to dismiss</div><div class="d">Return to chat with a gesture</div></div><div class="tog on" data-tog></div></div>' +
            '</div>',
        },

        chat: {
          title: 'Neo',
          sub: 'reply',
          h: 320,
          trace: ['Thinking it through'],
          body: '<div class="reply">I’m a single adaptive surface — no menu, no sidebar, no separate pages. Ask me to search, send PAX, write code, or generate an image, and I morph in place to handle it. Swipe up anytime to come back here.</div>',
        },
      }

      let busy = false
      function runTask(kind) {
        if (busy) return
        busy = true
        const cfg = SURFACES[kind]
        surface.style.setProperty('--task-h', cfg.h + 'px')
        taskIc.innerHTML = ICON[kind]
        taskTitle.textContent = cfg.title
        taskSub.textContent = cfg.sub
        taskBody.innerHTML = ''
        app.dataset.state = 'thinking'
        stateLabel.textContent = 'thinking'
        bar.value = ''

        if (firstTask) {
          grab.classList.add('show-hint')
          setTimeout(() => grab.classList.remove('show-hint'), 4200)
          firstTask = false
        }

        taskBody.appendChild(traceSteps(cfg.trace))

        const dwell = 520 + cfg.trace.length * 180 + 280
        setTimeout(() => {
          const r = document.createElement('div')
          r.className = 'result'
          r.innerHTML = '<div class="gap"></div>' + cfg.body
          taskBody.appendChild(r)
          app.dataset.state = 'task'
          stateLabel.textContent = kind
          busy = false
          if (cfg.after) cfg.after()
          // wire settings toggles
          taskBody
            .querySelectorAll('[data-tog]')
            .forEach((el) => el.addEventListener('click', () => el.classList.toggle('on')))
          taskBody.querySelectorAll('.seg').forEach((seg) =>
            seg.querySelectorAll('button').forEach((b) =>
              b.addEventListener('click', () => {
                seg.querySelectorAll('button').forEach((x) => x.classList.remove('on'))
                b.classList.add('on')
              }),
            ),
          )
        }, dwell)
      }

      function dismiss() {
        if (app.dataset.state === 'idle') return
        surface.style.setProperty('--task-h', '460px')
        app.dataset.state = 'idle'
        stateLabel.textContent = 'idle'
        setTimeout(() => {
          taskBody.innerHTML = ''
          bar.focus()
        }, 620)
      }

      function submit() {
        const v = bar.value.trim()
        if (!v) return
        runTask(classify(v))
      }
      document.getElementById('sendBtn').onclick = submit
      bar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit()
      })
      document
        .querySelectorAll('.chip')
        .forEach((c) => (c.onclick = () => runTask(classify(c.dataset.cmd))))
      document.getElementById('taskX').onclick = dismiss
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') dismiss()
      })

      /* swipe-up to dismiss (pointer drag on the grab handle) */
      let dragY = 0,
        dragging = false,
        startY = 0
      grab.addEventListener('pointerdown', (e) => {
        grab.setPointerCapture(e.pointerId)
        dragging = true
        startY = e.clientY
        surface.style.transition = 'transform .05s linear, opacity .05s linear'
      })
      grab.addEventListener('pointermove', (e) => {
        if (!dragging) return
        dragY = Math.min(0, e.clientY - startY)
        surface.style.transform = 'translateY(' + dragY + 'px) scale(' + (1 + dragY / 3000) + ')'
        surface.style.opacity = String(1 + dragY / 400)
      })
      function dragEnd() {
        if (!dragging) return
        dragging = false
        surface.style.transition = ''
        surface.style.transform = ''
        surface.style.opacity = ''
        if (dragY < -70) dismiss()
        dragY = 0
      }
      grab.addEventListener('pointerup', dragEnd)
      grab.addEventListener('pointercancel', dragEnd)

      /* slide-to-sign (wallet approval gate) */
      function initSign() {
        const track = document.getElementById('signTrack')
        const knob = document.getElementById('signKnob')
        const lbl = document.getElementById('signLbl')
        if (!track) return
        let down = false,
          sx = 0,
          x = 0
        const max = () => track.clientWidth - 53
        knob.addEventListener('pointerdown', (e) => {
          down = true
          sx = e.clientX - x
          knob.setPointerCapture(e.pointerId)
          knob.style.transition = 'none'
        })
        knob.addEventListener('pointermove', (e) => {
          if (!down) return
          x = Math.max(0, Math.min(max(), e.clientX - sx))
          knob.style.left = 5 + x + 'px'
        })
        knob.addEventListener('pointerup', () => {
          down = false
          knob.style.transition = ''
          if (x > max() * 0.85) {
            track.classList.add('signed')
            lbl.textContent = 'Approved — broadcasting…'
            setTimeout(() => (lbl.textContent = 'Confirmed · block 4,912,338 · 0x9f12…a73b'), 900)
          } else {
            x = 0
            knob.style.left = '5px'
          }
        })
      }

      /* login: DID challenge–response */
      const login = document.getElementById('login')
      document.getElementById('connectBtn').onclick = () => {
        login.classList.add('auth')
        setTimeout(() => {
          login.classList.add('gone')
          setTimeout(() => {
            login.style.display = 'none'
            bar.focus()
          }, 800)
        }, 1400)
      }
    </script>
  </body>
</html>
